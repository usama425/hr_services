<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>We've moved to a new ERP</title>
<style>
	:root {
		--bg: #f4f6fb;
		--glow-1: rgba(37, 99, 235, 0.16);
		--glow-2: rgba(16, 185, 129, 0.14);
		--card: #ffffff;
		--border: rgba(15, 23, 42, 0.07);
		--text: #0f172a;
		--muted: #5b6577;
		--soft: #f1f4f9;
		--accent: #2563eb;
		--accent-hover: #1d4ed8;
		--accent-soft: rgba(37, 99, 235, 0.10);
		--ok: #047857;
		--ok-soft: rgba(16, 185, 129, 0.14);
		--shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 12px 40px -12px rgba(15, 23, 42, 0.18);
		color-scheme: light;
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #0b1020;
			--glow-1: rgba(59, 130, 246, 0.20);
			--glow-2: rgba(16, 185, 129, 0.10);
			--card: #121a2e;
			--border: rgba(148, 163, 184, 0.12);
			--text: #e8edf7;
			--muted: #9aa6bd;
			--soft: #182240;
			--accent: #4f8cff;
			--accent-hover: #6b9eff;
			--accent-soft: rgba(79, 140, 255, 0.14);
			--ok: #34d399;
			--ok-soft: rgba(52, 211, 153, 0.12);
			--shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 20px 50px -16px rgba(0, 0, 0, 0.6);
			color-scheme: dark;
		}
	}
	* { box-sizing: border-box; }
	html, body { height: 100%; }
	body {
		margin: 0;
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
		color: var(--text);
		background:
			radial-gradient(60rem 40rem at 10% -10%, var(--glow-1), transparent 60%),
			radial-gradient(50rem 35rem at 110% 110%, var(--glow-2), transparent 60%),
			var(--bg);
		display: flex; align-items: center; justify-content: center;
		padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
		-webkit-font-smoothing: antialiased;
		line-height: 1.55;
	}
	.card {
		width: 100%; max-width: 540px;
		background: var(--card); border: 1px solid var(--border); border-radius: 20px;
		box-shadow: var(--shadow);
		padding: 40px 36px 30px;
		animation: rise .5s cubic-bezier(.2,.7,.2,1) both;
	}
	@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
	.badge {
		display: inline-flex; align-items: center; gap: 8px;
		font-size: 12.5px; font-weight: 600; letter-spacing: .02em;
		color: var(--ok); background: var(--ok-soft);
		padding: 6px 12px; border-radius: 999px;
	}
	.icon {
		width: 64px; height: 64px; border-radius: 18px;
		display: grid; place-items: center;
		background: var(--accent-soft); color: var(--accent);
		margin: 22px 0 18px;
	}
	h1 { font-size: clamp(22px, 4.6vw, 28px); line-height: 1.25; letter-spacing: -.015em; margin: 0 0 10px; }
	.lead { color: var(--muted); font-size: 15.5px; margin: 0 0 22px; }
	.url {
		display: flex; align-items: center; gap: 10px;
		background: var(--soft); border-radius: 12px;
		padding: 12px 14px; margin: 0 0 24px;
		font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
		font-size: 14px; word-break: break-all;
	}
	.url svg { flex: none; color: var(--muted); }
	.btn {
		display: inline-flex; align-items: center; justify-content: center; gap: 8px;
		width: 100%;
		font-weight: 600; font-size: 15px; text-decoration: none;
		color: #fff; background: var(--accent);
		padding: 13px 20px; border-radius: 12px;
		transition: background .15s ease, transform .15s ease;
	}
	.btn:hover { background: var(--accent-hover); }
	.btn:active { transform: translateY(1px); }
	.btn:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
	.note { color: var(--muted); font-size: 13px; margin: 16px 0 0; text-align: center; }
	footer {
		margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--border);
		color: var(--muted); font-size: 12.5px; text-align: center;
	}
	@media (max-width: 480px) { .card { padding: 30px 22px 24px; border-radius: 16px; } }
	@media (prefers-reduced-motion: reduce) { .card { animation: none; } }
</style>
</head>
<body>
	<main class="card">
		<span class="badge">
			<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
			Upgrade complete
		</span>

		<div class="icon" aria-hidden="true">
			<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
				<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
				<path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
				<path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
				<path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
			</svg>
		</div>

		<h1>We've upgraded our ERP</h1>
		<p class="lead">
			Our ERPNext system has moved to a new, upgraded home. This address is no longer in use.
			Please use the new link below from now on, and update your bookmarks.
		</p>

		<div class="url">
			<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
			<span>{{ url_text }}</span>
		</div>

		<a class="btn" href="{{ url }}" target="_blank" rel="noopener noreferrer">
			Go to the new ERP
			<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
		</a>
		<p class="note">Opens in a new tab.</p>

		<footer>Elite Resources · ERPNext</footer>
	</main>
</body>
</html>
