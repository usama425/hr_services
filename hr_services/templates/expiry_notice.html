<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Please wait...</title>
<style>
	:root { --bg: #ffffff; --track: #e5e9f0; --spin: #2563eb; --text: #5b6577; color-scheme: light; }
	@media (prefers-color-scheme: dark) {
		:root { --bg: #0b1020; --track: #1f2a44; --spin: #4f8cff; --text: #9aa6bd; color-scheme: dark; }
	}
	html, body { height: 100%; margin: 0; }
	body {
		background: var(--bg);
		display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
		-webkit-font-smoothing: antialiased;
	}
	.spinner {
		width: 44px; height: 44px; border-radius: 50%;
		border: 4px solid var(--track); border-top-color: var(--spin);
		animation: spin 0.9s linear infinite;
	}
	@keyframes spin { to { transform: rotate(360deg); } }
	p { margin: 0; color: var(--text); font-size: 14px; letter-spacing: 0.02em; }
</style>
</head>
<body>
	<div class="spinner" role="status" aria-label="Loading"></div>
	<p>Please wait...</p>
</body>
</html>
